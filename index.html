  Q({id:'q10', q:'Which blood vessel carries oxygenated blood AWAY from the heart?', options:['Pulmonary artery','Pulmonary vein','Superior vena cava','Inferior vena cava'], correct:0, explanation:'The pulmonary artery is the exception — it carries deoxygenated blood away from the heart to the lungs. The pulmonary vein carries oxygenated blood to the heart. All other arteries carry oxygenated blood away from the heart.', whyOthers:['Pulmonary vein carries oxygenated blood TO the heart.','Vena cavae carry deoxygenated blood to the heart.'], course:'c-anat', topic:'t-anat-cvs', level:'CHEW', difficulty:'Moderate', type:'high_yield_question', source:'Cardiovascular physiology', verified:false, clinical:false, exam:'Classic exception — pulmonary vessels.'}),

  Q({id:'q15', q:'A patient with cough of 2 weeks or more, night sweats and weight loss should be suspected of having:', options:['Pneumonia','Tuberculosis','Asthma','Bronchitis'], correct:1, explanation:'Chronic cough (>2 weeks) with night sweats and weight loss is the classic TB screening triad.', whyOthers:['Pneumonia is acute.','Asthma is episodic with wheeze.','Bronchitis is usually acute or with sputum.'], course:'c-cd', topic:'t-cd-tb', level:'JCHEW / CHEW', difficulty:'Moderate', type:'high_yield_question', source:'National TB Programme', verified:false, clinical:true, exam:'Classic TB screening question.'}),
  Q({id:'q16', q:'The mainstay of cholera management is:', options:['Antibiotics alone','Rehydration','Surgery','Blood transfusion'], correct:1, explanation:'Aggressive rehydration (ORS and/or IV fluids) is the cornerstone of cholera treatment. Antibiotics are adjunctive.', whyOthers:['Antibiotics alone cannot correct dehydration.','Surgery and blood transfusion are not treatments for cholera.'], course:'c-cd', topic:'t-cd-cholera', level:'JCHEW / CHEW', difficulty:'Moderate', type:'practice_question', source:'WHO cholera guidelines', verified:false, clinical:true, exam:'Emphasise rehydration first.'}),

const STORAGE_KEY = 'ahmad_chew_academy_v1';

const defaultState = {
  theme: 'light',
  progress: {},       // topicId -> {completed:true, ts}
  bookmarks: [],      // {id, type, title, ts}
  cbtHistory: [],     // {id, title, score, total, pct, timeUsed, date, topics:{topicId:{correct,total}}}
  practiceHistory: [],// {id, qid, correct, ts, course, topic}
  streak: {count:0, lastDate:null, dates:[]},
  settings: {name:'Candidate'},
  sessionCBT: null    // saved in-progress CBT
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(defaultState));
    const parsed = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(defaultState)), parsed);
  }catch(e){ console.warn('State load error', e); return JSON.parse(JSON.stringify(defaultState)); }
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.warn('State save error',e); } }

let state = loadState();

/* ============================ 3. HELPERS =================================== */

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

function esc(str){ return String(str??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function toast(msg, timeout=2200){
  const t = $('#toast');
  t.querySelector('div').textContent = msg;
  t.classList.remove('hidden'); t.classList.add('fade-in');
  clearTimeout(t._t);
  t._t = setTimeout(()=> t.classList.add('hidden'), timeout);
}

function todayStr(){ const d = new Date(); return d.toISOString().slice(0,10); }

function checkStreak(){
  const today = todayStr();
  const s = state.streak;
  if(s.lastDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(s.lastDate === yesterday){ s.count += 1; }
  else if(s.lastDate && s.lastDate !== today && s.lastDate !== yesterday){ s.count = 1; }
  else if(!s.lastDate){ s.count = 1; }
  s.lastDate = today;
  if(!s.dates.includes(today)) s.dates.push(today);
  if(s.dates.length > 60) s.dates = s.dates.slice(-60);
  saveState();
}

function getCourse(id){ return courses.find(c=>c.id===id); }
function getTopic(id){ return topics.find(t=>t.id===id); }
function questionsByCourse(cid){ return questions.filter(q=>q.course===cid); }
function topicProgress(courseId){
  const c = getCourse(courseId); if(!c) return 0;
  const done = c.topics.filter(t => state.progress[t]?.completed).length;
  return c.topics.length ? Math.round((done / c.topics.length)*100) : 0;
}
function isBookmarked(id){ return state.bookmarks.some(b=>b.id===id); }

function toggleBookmark(item, type, title){
  const i = state.bookmarks.findIndex(b=>b.id===item);
  if(i>=0) state.bookmarks.splice(i,1);
  else state.bookmarks.unshift({id:item, type, title, ts:Date.now()});
  saveState();
  toast(i>=0 ? 'Removed from bookmarks' : 'Bookmarked');
}

function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = String(Math.floor(sec/3600)).padStart(2,'0');
  const m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}

/* ---- PRACTICE ENGINE ---- */
let practiceSession = null;

function viewPractice(params){
  let pool = [];
  let title = 'Practice';
  if(params.topic){ pool = questions.filter(q=>q.topic===params.topic); title = `Practice — ${getTopic(params.topic)?.title||''}`; }
  else if(params.course){ pool = questions.filter(q=>q.course===params.course); title = `Practice — ${getCourse(params.course)?.title||''}`; }
  else if(params.ids){ pool = params.ids.map(id=>questions.find(q=>q.id===id)).filter(Boolean); title = params.title || 'Practice'; }
  else if(params.type){ pool = questions.filter(q=>q.type===params.type); title = params.title || 'Practice'; }
  else { pool = questions; title = 'All Questions Practice'; }

  if(!pool.length) return layout(emptyBlock('No questions found for this selection.'));
  pool = shuffle(pool).slice(0, Math.min(pool.length, params.limit || pool.length));

  if(!practiceSession || practiceSession.key !== (params.topic||params.course||params.type||'all')){
    practiceSession = { key: params.topic||params.course||params.type||'all', idx:0, pool, answers:{}, revealed:{} };
  }
  return layout(renderPractice(title));
}

function renderPractice(title){
  const s = practiceSession;
  const q = s.pool[s.idx];
  if(!q) return emptyBlock('No question.');
  const chosen = s.answers[q.id];
  const revealed = s.revealed[q.id];
  return `
    <div class="flex items-center justify-between mb-3">
      <button onclick="navigate('courses')" class="text-sm text-brand-600 hover:underline">← Back</button>
      <div class="text-xs text-slate-500">${s.idx+1} / ${s.pool.length}</div>
    </div>
    <div class="h-1.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden mb-4"><div class="h-full bg-brand-600 transition-all" style="width:${((s.idx+1)/s.pool.length)*100}%"></div></div>

    <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">
      <div class="flex flex-wrap gap-2 mb-3">${qBadge(q.type)}<span class="text-[11px] text-slate-500">${q.difficulty} • ${getTopic(q.topic)?.title||''}</span></div>
      <div class="font-semibold text-base mb-4">${esc(q.q)}</div>
      <div class="space-y-2">
        ${q.options.map((o,i)=>`
          <button onclick="answerPractice('${q.id}',${i})" ${revealed?'disabled':''} class="w-full text-left p-3 rounded-xl border ${revealed?(i===q.correct?'border-green-500 bg-green-50 dark:bg-green-900/20':(i===chosen?'border-red-500 bg-red-50 dark:bg-red-900/20':'border-slate-200 dark:border-slate-800')):(chosen===i?'border-brand-500 bg-brand-50 dark:bg-brand-900/20':'border-slate-200 dark:border-slate-800 hover:border-brand-400')} text-sm">
            <span class="font-bold mr-2">${String.fromCharCode(65+i)}.</span>${esc(o)}
          </button>
        `).join('')}
      </div>

      ${revealed?`
        <div class="mt-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-800 text-sm">
          <div class="font-bold ${chosen===q.correct?'text-green-600':'text-red-600'} mb-2">${chosen===q.correct?'✓ Correct':'✗ Incorrect'}</div>
          <div class="font-semibold mb-1">Explanation</div>
          <p class="text-slate-600 dark:text-slate-400">${esc(q.explanation)}</p>
          <div class="font-semibold mt-3 mb-1">Why other options are wrong</div>
          <ul class="list-disc pl-5 text-slate-600 dark:text-slate-400">${q.whyOthers.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
          ${q.exam?`<div class="mt-3 p-2 rounded-lg bg-amber-50 dark:bg-amber-900/20 text-amber-800 dark:text-amber-300 text-xs"><strong>Exam focus:</strong> ${esc(q.exam)}</div>`:''}
        </div>
      `:''}

      <div class="mt-4 flex gap-2">
        <button onclick="practicePrev()" ${s.idx===0?'disabled':''} class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-semibold disabled:opacity-40">← Previous</button>
        <button onclick="practiceNext()" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-sm font-semibold">${s.idx===s.pool.length-1?'Finish':'Next →'}</button>
      </div>
    </div>
  `;
}

function answerPractice(qid, choice){
  const s = practiceSession;
  if(s.revealed[qid]) return;
  s.answers[qid] = choice;
  s.revealed[qid] = true;
  const q = s.pool.find(x=>x.id===qid);
  state.practiceHistory.unshift({ id:qid, correct: choice===q.correct, ts:Date.now(), course:q.course, topic:q.topic });
  if(state.practiceHistory.length>500) state.practiceHistory = state.practiceHistory.slice(0,500);
  checkStreak(); saveState();
  render();
}
function practicePrev(){ if(practiceSession.idx>0){ practiceSession.idx--; render(); } }
function practiceNext(){ if(practiceSession.idx < practiceSession.pool.length-1){ practiceSession.idx++; render(); } else { toast('Practice session complete'); navigate('performance'); } }

function buildCBTQuestions(mode, courseId){
  let pool;
  if(mode==='mock'){ pool = questions.slice(); }
  else if(mode==='random'){ pool = questions.slice(); }
  else if(mode==='burning'){ pool = questions.filter(q=>q.type==='burning_brain'); }
  else if(mode==='highyield'){ pool = questions.filter(q=>q.type==='high_yield_question'); }
  else if(mode==='course'){ pool = questions.filter(q=>q.course===courseId); }
  else pool = questions.slice();
  pool = shuffle(pool);
  const limit = mode==='mock'? Math.min(60, pool.length) : Math.min(30, pool.length);
  return pool.slice(0, limit);
}

function startCBT(mode){
  let qs = buildCBTQuestions(mode);
  if(!qs.length){ toast('No questions available for this mode'); return; }
  const titles = { mock:'Full Mock Professional Exam', random:'Random CBT', burning:'Burning Brain CBT', highyield:'High-Yield CBT' };
  cbtRuntime = {
    id: 'cbt_'+Date.now(),
    title: titles[mode]||'CBT Examination',
    mode,
    questions: qs,
    answers:{}, flags:{}, idx:0,
    startedAt: Date.now(),
    duration: qs.length * 60, // 1 min per question
    submitted:false
  };
  navigate('cbt-run');
}

}

function cbtAnswer(i){

function cbtClear(){ if(!cbtRuntime) return; delete cbtRuntime.answers[cbtRuntime.questions[cbtRuntime.idx].id]; render(); }
function cbtFlag(){ if(!cbtRuntime) return; const id = cbtRuntime.questions[cbtRuntime.idx].id; cbtRuntime.flags[id] = !cbtRuntime.flags[id]; render(); }
function cbtNav(d){ if(!cbtRuntime) return; const n = cbtRuntime.idx + d; if(n>=0 && n<cbtRuntime.questions.length){ cbtRuntime.idx = n; render(); } }
function cbtJump(i){ if(!cbtRuntime) return; if(i>=0 && i<cbtRuntime.questions.length){ cbtRuntime.idx = i; render(); } }

function submitCBT(auto){
  if(!cbtRuntime) return;
  const r = cbtRuntime;
  const answered = Object.keys(r.answers).length;
  const unanswered = r.questions.length - answered;
  const flagged = Object.values(r.flags).filter(Boolean).length;
  if(!auto){
    const ok = confirm(`EXAM SUMMARY\n\nAnswered: ${answered}\nUnanswered: ${unanswered}\nFlagged: ${flagged}\nTotal: ${r.questions.length}\n\nAre you sure you want to submit your examination?`);
    if(!ok) return;
  }
  r.submitted = true;
  const correct = r.questions.filter(q=>r.answers[q.id]===q.correct).length;
  const wrong = answered - correct;
  const pct = Math.round((correct / r.questions.length)*100);
  const timeUsed = Math.floor((Date.now()-r.startedAt)/1000);
  const topicsMap = {};
  r.questions.forEach(q=>{
    const t = q.topic;
    if(!topicsMap[t]) topicsMap[t] = {correct:0,total:0};
    topicsMap[t].total++;
    if(r.answers[q.id]===q.correct) topicsMap[t].correct++;
  });
  const record = { id:r.id, title:r.title, score:correct, total:r.questions.length, pct, timeUsed, date:Date.now(), topics:topicsMap, questions:r.questions, answers:r.answers };
  state.cbtHistory.unshift(record);
  if(state.cbtHistory.length>30) state.cbtHistory = state.cbtHistory.slice(0,30);
  checkStreak(); saveState();
  if(auto) toast('TIME EXPIRED — Examination auto-submitted');
  render();
}

  const hist = state.cbtHistory;
  const totalExams = hist.length;
  const avg = totalExams? Math.round(hist.reduce((a,h)=>a+h.pct,0)/totalExams) : 0;
  const best = totalExams? Math.max(...hist.map(h=>h.pct)) : 0;
  const practiceTotal = state.practiceHistory.length;
  const practiceCorrect = state.practiceHistory.filter(p=>p.correct).length;
  const accuracy = practiceTotal? Math.round((practiceCorrect/practiceTotal)*100) : 0;

  // topic weakness
  const topicAgg = {};
  hist.forEach(h=>{
    Object.entries(h.topics||{}).forEach(([tid,s])=>{
      if(!topicAgg[tid]) topicAgg[tid] = {correct:0,total:0};
      topicAgg[tid].correct += s.correct; topicAgg[tid].total += s.total;
    });
  });
  const topicPerf = Object.entries(topicAgg).map(([tid,s])=>({tid, pct: Math.round((s.correct/s.total)*100), total:s.total})).filter(x=>x.total>=1);
  topicPerf.sort((a,b)=>a.pct-b.pct);
  const weak = topicPerf.filter(t=>t.pct<60).slice(0,5);
  const strong = topicPerf.filter(t=>t.pct>=75).slice(-5).reverse();

  return layout(`
    <h1 class="text-xl sm:text-2xl font-extrabold mb-1">📊 My Performance</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-5">Analytics, weak-area detection and learning history.</p>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
      <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4"><div class="text-2xl font-extrabold text-brand-700 dark:text-brand-400">${totalExams}</div><div class="text-[11px] text-slate-500">CBT exams</div></div>
      <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4"><div class="text-2xl font-extrabold text-brand-700 dark:text-brand-400">${avg}%</div><div class="text-[11px] text-slate-500">Avg score</div></div>
      <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4"><div class="text-2xl font-extrabold text-brand-700 dark:text-brand-400">${best}%</div><div class="text-[11px] text-slate-500">Best score</div></div>
      <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4"><div class="text-2xl font-extrabold text-brand-700 dark:text-brand-400">${accuracy}%</div><div class="text-[11px] text-slate-500">Practice accuracy</div></div>
    </div>

    ${weak.length?`
    <div class="rounded-2xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 p-5 mb-5">
      <h3 class="font-bold text-red-800 dark:text-red-300 mb-2">⚠️ Weak Areas — focus here</h3>
      <div class="space-y-2">
        ${weak.map(t=>`
          <div class="flex items-center justify-between gap-3">
            <div class="text-sm text-red-900 dark:text-red-200">${getTopic(t.tid)?.title||t.tid} <span class="text-[11px]">(${t.pct}%)</span></div>
            <div class="flex gap-2">
              <button onclick="navigate('practice',{topic:'${t.tid}'})" class="text-[11px] px-2 py-1 rounded-lg bg-white dark:bg-slate-800 font-semibold">Practice</button>
              <button onclick="navigate('topic',{id:'${t.tid}'})" class="text-[11px] px-2 py-1 rounded-lg bg-white dark:bg-slate-800 font-semibold">Review</button>
            </div>
          </div>`).join('')}
      </div>
    </div>`:''}

    ${strong.length?`
    <div class="rounded-2xl bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 p-5 mb-5">
      <h3 class="font-bold text-green-800 dark:text-green-300 mb-2">✓ Strong Topics</h3>
      <div class="flex flex-wrap gap-2">
        ${strong.map(t=>`<span class="text-xs px-2 py-1 rounded-lg bg-white dark:bg-slate-800">${getTopic(t.tid)?.title||t.tid} — ${t.pct}%</span>`).join('')}
      </div>
    </div>`:''}

    <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">
      <h3 class="font-bold mb-3">CBT History</h3>
      ${hist.length? `<div class="space-y-2">${hist.map(h=>`
        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800">
          <div><div class="text-sm font-semibold">${esc(h.title)}</div><div class="text-[11px] text-slate-500">${new Date(h.date).toLocaleString()} • ${fmtTime(h.timeUsed||0)}</div></div>
          <div class="text-right"><div class="font-bold ${h.pct>=50?'text-green-600':'text-red-600'}">${h.pct}%</div><div class="text-[11px] text-slate-500">${h.score}/${h.total}</div></div>
        </div>`).join('')}</div>` : emptyBlock('No CBT exams yet.')}
    </div>
  `);
}

  const q1 = questions[day % questions.length];
  const challenge = shuffle(questions).slice(0,5);
  return layout(`
    <h1 class="text-xl sm:text-2xl font-extrabold mb-1">📅 Daily Challenge</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-5">Question of the day, a 5-question challenge and a quick revision point.</p>

    <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 mb-4">
      <div class="text-[11px] font-semibold text-brand-600">QUESTION OF THE DAY</div>
      <div class="font-semibold mt-2">${esc(q1.q)}</div>
      <div class="mt-3 space-y-2">
        ${q1.options.map((o,i)=>`
          <button onclick="dailyAnswer(this,${i},${q1.correct})" class="w-full text-left p-3 rounded-xl border border-slate-200 dark:border-slate-800 text-sm hover:border-brand-400">
            <span class="font-bold mr-2">${String.fromCharCode(65+i)}.</span>${esc(o)}
          </button>`).join('')}
      </div>
    </div>

    <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 mb-4">
      <h3 class="font-bold mb-2">Quick Revision Point</h3>
      <p class="text-sm text-slate-600 dark:text-slate-400">Primary Health Care was declared at the Alma-Ata Conference in <strong>1978</strong>. Its goal: <em>Health for All by the Year 2000</em>. The 8 components remain a high-yield exam topic — know them all.</p>
    </div>

    <button onclick="navigate('practice',{ids:${JSON.stringify(challenge.map(q=>q.id))},title:'📅 Daily 5-Question Challenge',limit:5})" class="w-full py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-600 text-white font-bold">Start 5-Question Challenge</button>
  `);
}
function dailyAnswer(el, chosen, correct){
  if(el.dataset.done) return;
  el.dataset.done = '1';
  const opts = el.parentElement.querySelectorAll('button');
  opts.forEach((b,i)=>{ b.disabled = true; if(i===correct) b.classList.add('border-green-500','bg-green-50','dark:bg-green-900/20'); else if(i===chosen) b.classList.add('border-red-500','bg-red-50','dark:bg-red-900/20'); });
  checkStreak(); saveState();
}

/* ---- SEARCH ---- */
function viewSearch(){
  return layout(`
    <h1 class="text-xl sm:text-2xl font-extrabold mb-1">🔍 Search</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Search courses, topics, handouts, questions and skills.</p>
    <input id="searchInput" oninput="doSearch(this.value)" placeholder="Type a keyword… e.g. malaria, PHC, MUAC" class="w-full px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-sm outline-none focus:border-brand-500" />
    <div id="searchResults" class="mt-5 space-y-3"></div>
  `);
}
function doSearch(term){
  const box = $('#searchResults');
  term = term.trim().toLowerCase();
  if(!term){ box.innerHTML = '<div class="text-sm text-slate-500 text-center py-6">Start typing to search…</div>'; return; }
  const rCourses = courses.filter(c=> (c.title+c.desc+c.code).toLowerCase().includes(term));
  const rTopics = topics.filter(t=> (t.title + t.objectives.join(' ') + t.sections.map(s=>(s.h||'')+(s.p||'')+(s.ul||[]).join('')+(s.ol||[]).join('')+(s.div||'')).join(' ')).toLowerCase().includes(term));
  const rQuestions = questions.filter(q=> (q.q + q.options.join(' ') + q.explanation).toLowerCase().includes(term)).slice(0,20);
  const rSkills = practicalSkills.filter(s=> (s.title+s.purpose).toLowerCase().includes(term));
  const rScen = clinicalScenarios.filter(s=> (s.title+s.case).toLowerCase().includes(term));

  const sec = (title, items, renderer) => items.length? `
    <div>
      <h3 class="text-xs font-bold uppercase text-slate-500 mb-2">${title} (${items.length})</h3>
      <div class="space-y-2">${items.map(renderer).join('')}</div>
    </div>` : '';

  box.innerHTML =
    sec('Courses', rCourses, c=>`<button onclick="navigate('course',{id:'${c.id}'})" class="w-full text-left p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-brand-400"><div class="font-semibold text-sm">${c.title}</div><div class="text-[11px] text-slate-500">${c.code}</div></button>`) +
    sec('Topics', rTopics, t=>`<button onclick="navigate('topic',{id:'${t.id}'})" class="w-full text-left p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-brand-400"><div class="font-semibold text-sm">${t.title}</div><div class="text-[11px] text-slate-500">${getCourse(t.course)?.title||''}</div></button>`) +
    sec('Questions', rQuestions, q=>`<button onclick="navigate('practice',{ids:['${q.id}'],title:'Search Result',limit:1})" class="w-full text-left p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-brand-400"><div class="text-sm">${esc(q.q.slice(0,90))}${q.q.length>90?'…':''}</div><div class="text-[11px] text-slate-500">${getTopic(q.topic)?.title||''}</div></button>`) +
    sec('Practical Skills', rSkills, s=>`<button onclick="navigate('skill',{id:'${s.id}'})" class="w-full text-left p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-brand-400"><div class="font-semibold text-sm">${s.title}</div></button>`) +
    sec('Clinical Scenarios', rScen, s=>`<button onclick="navigate('scenario',{id:'${s.id}'})" class="w-full text-left p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-brand-400"><div class="font-semibold text-sm">${s.title}</div></button>`);

  if(!box.innerHTML.trim()) box.innerHTML = '<div class="text-sm text-slate-500 text-center py-6">No results found.</div>';
}
window.doSearch = doSearch;

/* ============================ 5. ROUTER / RENDER =========================== */

function render(){
  checkStreak();
  const r = currentRoute;
  let html = '';
  switch(r.name){
    case 'home': html = viewHome(); break;
    case 'courses': html = viewCourses(); break;
    case 'course': html = viewCourse(r.params); break;
    case 'topic': html = viewTopic(r.params); break;
    case 'practice': html = viewPractice(r.params); break;
    case 'past': html = viewPast(); break;
    case 'burning': html = viewBurning(); break;
    case 'highyield': html = viewHighYield(); break;
    case 'clinical': html = viewClinical(); break;
    case 'scenario': html = viewScenario(r.params); break;
    case 'skills': html = viewSkills(); break;
    case 'skill': html = viewSkill(r.params); break;
    case 'cbt': html = viewCBT(); break;
    case 'cbt-run': html = viewCBTRun(); break;
    case 'cbt-result': html = viewCBTResult(); break;
    case 'performance': html = viewPerformance(); break;
    case 'daily': html = viewDaily(); break;
    case 'bookmarks': html = viewBookmarks(); break;
    case 'search': html = viewSearch(); break;
    case 'sources': html = viewSources(); break;
    case 'about': html = viewAbout(); break;
    case 'disclaimer': html = viewDisclaimer(); break;
    case 'more': html = viewMore(); break;
    default: html = viewHome();
  }
  document.documentElement.classList.toggle('dark', state.theme==='dark');
  $('#app').innerHTML = html;
  // restore search input value if on search
  if(r.name==='search'){ const inp = $('#searchInput'); if(inp) inp.focus(); }
  if(r.name==='cbt-run' && cbtRuntime && !cbtRuntime.submitted) startCBTTimer();
}

function startCBTTimer(){
  clearInterval(cbtTimerInterval);
  cbtTimerInterval = setInterval(()=>{
    if(!cbtRuntime || cbtRuntime.submitted){ clearInterval(cbtTimerInterval); return; }
    const remaining = Math.max(0, cbtRuntime.duration - Math.floor((Date.now()-cbtRuntime.startedAt)/1000));
    const el = $('#cbtTimer');
    if(el) el.textContent = fmtTime(remaining);
    if(remaining<=0){ clearInterval(cbtTimerInterval); submitCBT(true); }
  }, 1000);
}

function toggleTheme(){
  state.theme = state.theme==='dark'?'light':'dark';
  saveState();
  render();
}
window.toggleTheme = toggleTheme;

/* expose navigation & handlers to inline onclick */
window.navigate = navigate;
window.answerPractice = answerPractice;
window.practicePrev = practicePrev;
window.practiceNext = practiceNext;
window.markTopicDone = markTopicDone;
window.toggleBookmark = toggleBookmark;
window.startCBT = startCBT;
window.startCourseCBT = startCourseCBT;
window.cbtAnswer = cbtAnswer;
window.cbtClear = cbtClear;
window.cbtFlag = cbtFlag;
window.cbtNav = cbtNav;
window.cbtJump = cbtJump;
window.submitCBT = submitCBT;
window.answerScenario = answerScenario;
window.scenarioNav = scenarioNav;
window.dailyAnswer = dailyAnswer;

/* ============================ 6. BOOT ====================================== */
render();
</script>
