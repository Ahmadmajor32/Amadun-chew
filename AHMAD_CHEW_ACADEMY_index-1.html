<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><meta name="description" content="AHMAD CHEW ACADEMY - Community Health learning, practice and CBT platform.">
<title>AHMAD CHEW ACADEMY</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f0fdfa',100:'#ccfbf1',600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a'}}}}}</script>
<style>html{scroll-behavior:smooth}body{font-family:Inter,system-ui,sans-serif}.card{transition:.18s}.card:hover{transform:translateY(-2px)}button:focus-visible,a:focus-visible{outline:3px solid #14b8a6;outline-offset:2px}</style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
<div id="app"></div>
<script>
const COURSES=[
['CHE 101','Introduction to Community Health','Community Health foundations, PHC, prevention and community participation.'],
['CHE 102','Human Anatomy & Physiology I','Cells, tissues, organs and basic body systems.'],
['CHE 103','Human Anatomy & Physiology II','Major body systems, homeostasis and structure-function relationships.'],
['CHE 104','Primary Health Care','PHC principles, elements, levels of care, referral and equity.'],
['CHE 105','Community-Based Health Care','Community diagnosis, needs assessment, mobilisation and participation.'],
['CHE 106','Professional Ethics & Practice','Ethics, confidentiality, documentation, scope and teamwork.'],
['CHE 107','Health Promotion & Education','Communication, counselling, behaviour change and health promotion.'],
['CHE 108','Environmental Health','Water, sanitation, waste, housing, food hygiene and risks.'],
['CHE 109','Human Nutrition','Nutrients, balanced diets, malnutrition and nutrition assessment.'],
['CHE 110','Communicable Diseases','Transmission, prevention, surveillance and control.'],
['CHE 111','Non-Communicable Diseases','Risk factors, prevention, screening and referral.'],
['CHE 112','Maternal & Reproductive Health','ANC, safe motherhood, family planning and referral.'],
['CHE 113','Child Health & IMCI','Child assessment, danger signs and common childhood conditions.'],
['CHE 114','Immunisation','Vaccination, schedules, cold chain, safety and mobilisation.'],
['CHE 115','Clinical Skills','Vital signs, history, examination, documentation and safe procedures.'],
['CHE 116','Laboratory Services','Specimens, rapid tests, infection prevention and interpretation.'],
['CHE 117','Health Statistics','Data, rates, ratios, percentages, tables, graphs and interpretation.'],
['CHE 118','Health Information & Records','Registers, reporting, data quality and confidentiality.'],
['CHE 119','Emergency & First Aid','Emergency recognition, basic support and referral.'],
['CHE 120','Pharmacology & Medicines','Medicine safety, routes, adherence and rational use.'],
['CHE 121','Behavioural Science','Behaviour, culture, learning, motivation and health seeking.'],
['CHE 122','Health Sociology','Family, community, social determinants and inequalities.'],
['CHE 123','Research Methods','Questions, designs, sampling, data collection and ethics.'],
['CHE 124','Computer & Digital Health','Computer literacy, digital records and privacy.'],
['CHE 125','Health Programme Management','Planning, implementation, monitoring and evaluation.']
];
const TOPICS=[
{id:'phc',course:'CHE 104',title:'Primary Health Care: Core Principles',tag:'High Yield',summary:'Understand PHC as a practical approach to bringing essential health services closer to people.',definition:'Primary Health Care is an approach to health that emphasizes essential, accessible and community-oriented care, with prevention, health promotion, treatment and referral working together.',points:['PHC should be accessible and acceptable to the community.','Community participation is a central idea.','Prevention and health promotion are important alongside treatment.','Appropriate technology should be practical, affordable and evidence-informed.','Referral links different levels of care.'],hausa:'A sauƙaƙe, PHC shi ne kula da lafiyar mutane daga matakin da suke rayuwa. Ba wai jiran mutum ya yi rashin lafiya sosai ya zo asibiti ba; ana haɗa rigakafi, wayar da kai, gano matsala da wuri, basic care da referral.',clinical:'Recognize what can be managed within authorized competence and what requires prompt referral. Learning notes do not replace current Standing Orders.',trap:'Do not define PHC as only a small clinic or only treatment of minor illnesses.'},
{id:'vitals',course:'CHE 115',title:'Vital Signs: Practical Foundation',tag:'Practical',summary:'Know what vital signs tell you and how to record them correctly.',definition:'Vital signs are basic measurements used to assess physiological status and detect changes requiring further assessment.',points:['Common measurements include temperature, pulse, respiratory rate and blood pressure; oxygen saturation may also be assessed where available.','Use correct equipment and technique.','Record value, unit, time and context.','Interpret findings with age, symptoms and clinical context.','Repeat or escalate concerning findings according to protocol.'],hausa:'Vital signs su ne wasu daga cikin abubuwan farko da ake dubawa domin sanin yadda jikin mutum yake. Ba lambar kaɗai ake kallo ba; yanayin mutum, shekarunsa da alamominsa suna da muhimmanci.',clinical:'During posting, explain the procedure, use infection-prevention measures, measure carefully, document immediately and report concerning findings to the supervisor.',trap:'Do not memorize one normal number for every person and every situation.'},
{id:'immunisation',course:'CHE 114',title:'Immunisation: How to Think About It',tag:'High Yield',summary:'Connect vaccines, schedules, cold chain, safety and mobilisation.',definition:'Immunisation is the process by which a person becomes protected against a disease, commonly through vaccination.',points:['Vaccination is a major preventive intervention.','Schedules provide protection at appropriate ages and intervals.','Cold-chain integrity helps preserve vaccine potency.','Safe injection and waste disposal reduce preventable harm.','Missed doses should follow current official guidance.'],hausa:'Immunisation ba allurar kawai ba ce. Ya haɗa da vaccine, lokaci, adana vaccine yadda ya dace, safe injection, documentation da tabbatar da cewa iyaye sun fahimci muhimmancin kammala schedule.',clinical:'For current Nigerian schedules, use the latest official programme guidance available to your facility.',trap:'Do not rely on an old timetable when the official programme has been updated.'},
{id:'imci',course:'CHE 113',title:'Child Assessment & Danger Signs',tag:'Clinical',summary:'Approach a sick child systematically and recognize when urgent referral is needed.',definition:'Child assessment is a structured process of identifying symptoms, danger signs, examination findings and the need for treatment, follow-up or referral.',points:['Start with immediate danger assessment.','Ask focused history questions and observe general condition.','Assess relevant signs according to the applicable guideline.','Document significant positive and negative findings.','Urgent or severe findings require prompt escalation/referral.'],hausa:'A wajen yaro mara lafiya, kada a fara da magani kai tsaye ba tare da duba ko akwai danger sign ba. Ana fara da ganin ko yaron na cikin yanayin da ke bukatar gaggawar taimako ko referral.',clinical:'Use current IMCI/IMNCI or facility protocol taught by your institution. This platform is for learning and not a substitute for supervised clinical decision-making.',trap:'Do not assume that absence of fever means a child is safe.'},
{id:'nutrition',course:'CHE 109',title:'Balanced Diet & Malnutrition',tag:'Core',summary:'Understand nutrients, balanced diets and the community role in preventing malnutrition.',definition:'A balanced diet provides a variety of nutrients and energy in amounts appropriate for the person’s needs.',points:['Major nutrient groups include carbohydrates, proteins, fats, vitamins, minerals and water.','Needs vary with age and physiological state.','Malnutrition includes undernutrition and overnutrition.','Growth monitoring and nutrition assessment help identify problems early.','Counselling should respect household resources and locally available foods.'],hausa:'Balanced diet yana nufin abinci da ya samar da abubuwan da jiki ke bukata ba tare da dogaro da abu guda ba. Abin da ake da shi a gida da al’adar abinci ma suna da muhimmanci.',clinical:'Use approved assessment tools and referral pathways for suspected severe malnutrition.',trap:'A balanced diet does not mean expensive food; it means appropriate variety and adequacy.'},
{id:'ethics',course:'CHE 106',title:'Professional Ethics & Confidentiality',tag:'High Yield',summary:'Build trust through professional conduct, confidentiality and accountable documentation.',definition:'Professional ethics are principles that guide responsible, respectful and safe conduct in health practice.',points:['Respect dignity, privacy and autonomy within professional and legal limits.','Keep client information confidential through appropriate channels.','Document care accurately and promptly.','Know your scope and seek supervision when needed.','Treat clients and colleagues respectfully.'],hausa:'Ethics yana koya wa ma’aikacin lafiya yadda zai yi aiki cikin mutunci, sirri, gaskiya da alhaki. Idan ba ka da tabbacin wani abu, neman supervision ya fi yin abu da zato.',clinical:'Good documentation is part of safe care. Never falsify a record or document an action that was not performed.',trap:'Confidentiality does not mean hiding serious safety concerns from the appropriate professional pathway.'},
{id:'community',course:'CHE 105',title:'Community Diagnosis',tag:'Community',summary:'Move from assumptions to evidence when identifying community health problems.',definition:'Community diagnosis is a systematic assessment of a community’s health status, needs, resources and priority problems.',points:['Collect relevant information before deciding the main problem.','Use records and community-level information where appropriate.','Distinguish felt needs from identified needs.','Consider magnitude, seriousness, feasibility and community priorities.','Involve community members in understanding problems and solutions.'],hausa:'Community diagnosis kamar binciken lafiyar community ne. Ba wai ka ji magana guda ka ce wannan shi ne babban problem ba. Ana tattara bayanai, a fahimci needs, resources da priorities sannan a tsara action.',clinical:'Respectful community entry, communication and accurate data collection improve diagnosis quality.',trap:'The loudest complaint is not automatically the highest-priority health problem.'},
{id:'emergency',course:'CHE 119',title:'Emergency First Response',tag:'Practical',summary:'Recognize emergencies, prioritize immediate safety and escalate appropriately.',definition:'Emergency care begins with rapid recognition, immediate basic support within competence, and timely escalation or referral.',points:['Ensure scene and personal safety first.','Rapidly identify life-threatening problems.','Call for appropriate help early.','Provide only interventions within training and current protocol.','Document and hand over relevant information clearly.'],hausa:'A emergency, abu na farko shi ne safety da gano abin da zai iya kashe mutum cikin gaggawa. Ba a yin gwaji da abin da ba ka iya ba; ana taimakawa gwargwadon training sannan a kira senior/referral.',clinical:'Follow current institutional emergency protocols and supervised practice.',trap:'Do not delay urgent referral while trying to complete a non-urgent assessment.'},
{id:'education',course:'CHE 107',title:'Effective Health Education',tag:'Community',summary:'Turn health information into communication people can understand and act on.',definition:'Health education is a planned process of helping people gain knowledge and skills that support healthier decisions and actions.',points:['Start from audience needs, beliefs and existing knowledge.','Use simple, respectful language.','Encourage participation.','Check understanding with feedback or teach-back.','Evaluate whether understanding or behaviour changed.'],hausa:'Health education ba wai magana mai yawa ba ce. Manufarta ita ce mutum ya fahimci abin da zai yi, dalilin da zai yi, da yadda zai iya yin sa cikin yanayinsa.',clinical:'Avoid blaming clients. Identify practical barriers and work toward realistic actions.',trap:'Knowing something does not automatically mean a person will change behaviour.'}
];
const QUESTIONS=[
['q1','CHE 104','Primary Health Care','Which idea is central to Primary Health Care?',['Community participation','Hospital admission for every illness','Treatment only','Specialist care only'],0,'Community participation is a core PHC principle.'],
['q2','CHE 115','Vital Signs','Why should a vital-sign reading be interpreted with clinical context?',['Every person has the same normal value','Age, symptoms and circumstances affect interpretation','Documentation is unnecessary','Equipment does not matter'],1,'Measurements must be interpreted alongside relevant context.'],
['q3','CHE 114','Immunisation','Why is the vaccine cold chain important?',['To change vaccine colour','To help preserve vaccine potency','To make vaccines taste better','To avoid documentation'],1,'Correct storage conditions help maintain potency.'],
['q4','CHE 106','Professional Ethics','Which action best demonstrates professional accountability?',['Falsifying a record','Documenting care accurately','Sharing client information publicly','Ignoring supervision'],1,'Accurate documentation supports safe accountable practice.'],
['q5','CHE 105','Community Diagnosis','What should normally happen before selecting a community health priority?',['Assume the problem','Collect and assess relevant information','Choose the most expensive intervention','Ignore community views'],1,'Evidence and community input help establish priorities.'],
['q6','CHE 113','Child Health','When assessing a sick child, what should receive early attention?',['Immediate danger signs','Favourite food','School uniform','Career plans'],0,'Immediate danger signs can indicate urgent action or referral.'],
['q7','CHE 109','Nutrition','Which statement about a balanced diet is most accurate?',['It must be expensive','It depends on one food','It provides appropriate variety and nutrients','It excludes water'],2,'A balanced diet provides appropriate nutrients and energy through suitable variety.'],
['q8','CHE 119','Emergency','What should be considered first at an emergency scene?',['Personal and scene safety','Monthly report','Long history before urgent action','Leave the client alone'],0,'Safety comes before intervention.'],
['q9','CHE 107','Health Education','Which approach best checks whether a client understood health education?',['Teach-back or feedback','Speaking faster','Using more technical words','Avoiding questions'],0,'Teach-back helps confirm understanding.'],
['q10','CHE 104','PHC','Why is referral important in a health system?',['It prevents teamwork','It connects clients to a level able to provide needed care','It replaces assessment','It is only administrative'],1,'Referral connects clients to appropriate services beyond current capacity.']
];
const SOURCES=[['CHPRBN Official Resources','https://chprbn.gov.ng/home2/','Official Board resources including curriculum and National Standing Order sections.'],['CHPRBN CHEW National Standing Orders','https://chprbn.gov.ng/wp-content/uploads/2024/12/CHEW-Section-1-7-TEXT.pdf','Official CHEW Standing Orders PDF.'],['CHPRBN JCHEW National Standing Orders','https://chprbn.gov.ng/wp-content/uploads/2024/12/JCHEW-Section-1-7-TEXT-1.pdf','Official JCHEW Standing Orders PDF.'],['CHPRBN Education Development & Standards','https://chprbn.gov.ng/department-education-development-and-standards/','Official Board page covering education, curricula, examination and certification functions.']];
const KEY='ahmad_chew_academy_v3';
let S=(()=>{try{return Object.assign({theme:'light',completed:{},bookmarks:[],scores:[]},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return{theme:'light',completed:{},bookmarks:[],scores:[]}}})();
let view='home',course=null,topic=null,quiz=null,timer=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const courseData=id=>COURSES.find(x=>x[0]===id), topics=id=>TOPICS.filter(x=>x.course===id);
function nav(v){view=v;course=topic=null;quiz=null;render();scrollTo(0,0)}
function theme(){document.documentElement.classList.toggle('dark',S.theme==='dark')}
function header(){return `<header class="sticky top-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800"><div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3"><button onclick="nav('home')" class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl bg-brand-700 text-white grid place-items-center font-black">AC</span><span class="text-left"><b>AHMAD CHEW ACADEMY</b><small class="block text-[10px] text-slate-500">COMMUNITY HEALTH LEARNING</small></span></button><nav class="hidden md:flex gap-1">${['home','courses','practice','cbt','performance','sources'].map(x=>`<button onclick="nav('${x}')" class="px-3 py-2 rounded-lg text-sm font-semibold">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</nav><button onclick="S.theme=S.theme==='dark'?'light':'dark';save();theme();render()" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-700">${S.theme==='dark'?'☀':'☾'}</button></div></header>`}
function stat(a,b,c){return `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5"><small class="text-slate-500">${a}</small><div class="text-3xl font-black mt-1">${b}</div><small class="text-slate-500">${c}</small></div>`}
function home(){let done=Object.values(S.completed).filter(Boolean).length,avg=S.scores.length?Math.round(S.scores.reduce((a,b)=>a+b.p,0)/S.scores.length):0;return `<section class="rounded-3xl bg-gradient-to-br from-brand-800 to-brand-600 text-white p-7 md:p-10"><span class="px-3 py-1 rounded-full bg-white/15 text-sm">Community Health Learning Platform</span><h1 class="text-3xl md:text-5xl font-black mt-4">Learn. Practice. Test. Improve.</h1><p class="mt-4 max-w-2xl text-brand-50 leading-7">Course study, focused topics, Hausa support, practice questions, CBT, clinical thinking and personal performance in one mobile-friendly learning space.</p><div class="flex flex-wrap gap-3 mt-7"><button onclick="nav('courses')" class="px-5 py-3 bg-white text-brand-800 rounded-xl font-bold">Start Learning</button><button onclick="nav('cbt')" class="px-5 py-3 bg-brand-900/40 rounded-xl font-bold">Take CBT</button></div></section><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">${stat('Courses',COURSES.length,'Course areas')}${stat('Learning topics',TOPICS.length,'Focused modules')}${stat('Practice questions',QUESTIONS.length,'Clearly labelled practice')}${stat('Average score',avg+'%','Saved CBT attempts')}</div><div class="grid lg:grid-cols-3 gap-5 mt-8"><section class="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5"><h2 class="text-xl font-black">How to use the academy</h2><div class="grid sm:grid-cols-2 gap-3 mt-4">${[['1','Choose a course'],['2','Read a topic'],['3','Practice and test'],['4','Review weak areas']].map(x=>`<div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800"><b class="text-brand-700">${x[0]}</b><h3 class="font-bold mt-2">${x[1]}</h3></div>`).join('')}</div></section><section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5"><h2 class="text-xl font-black">Progress</h2><div class="mt-4 text-sm flex justify-between"><span>Topics completed</span><b>${done}/${TOPICS.length}</b></div><div class="h-2 bg-slate-100 dark:bg-slate-800 rounded-full mt-2"><div class="h-full bg-brand-600 rounded-full" style="width:${TOPICS.length?done/TOPICS.length*100:0}%"></div></div><button onclick="nav('performance')" class="w-full mt-5 py-3 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold">View Performance</button></section></div><section class="mt-8"><h2 class="text-2xl font-black">Start with these topics</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">${TOPICS.slice(0,6).map(topicCard).join('')}</div></section><div class="mt-8 p-5 rounded-2xl bg-amber-50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900/50"><b>Clinical safety:</b> Educational content does not replace current official guidance, authorized scope, supervision or facility protocols.</div>`}
function topicCard(t){return `<button onclick="openTopic('${t.id}')" class="card text-left bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5"><span class="text-xs font-bold text-brand-700">${esc(t.tag)}</span><h3 class="font-extrabold text-lg mt-3">${esc(t.title)}</h3><p class="text-sm text-slate-500 mt-2">${esc(t.summary)}</p><div class="mt-4 text-xs ${S.completed[t.id]?'text-emerald-600':'text-slate-500'}">${S.completed[t.id]?'✓ Completed':'Open lesson'} →</div></button>`}
function courses(){return `<div class="flex flex-col md:flex-row md:items-end justify-between gap-3 mb-6"><div><h1 class="text-3xl font-black">Courses</h1><p class="text-slate-500">Open a course and study its available topics.</p></div><input oninput="filterCourses(this.value)" placeholder="Search courses..." class="px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 w-full md:w-80"></div><div id="courseGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${COURSES.map(c=>`<button data-s="${esc(c.join(' '))}" onclick="openCourse('${c[0]}')" class="card text-left bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5"><span class="text-xs font-bold text-brand-700">${c[0]}</span><h2 class="font-extrabold text-lg mt-3">${esc(c[1])}</h2><p class="text-sm text-slate-500 mt-2">${esc(c[2])}</p><div class="mt-4 text-xs text-brand-700 font-bold">${topics(c[0]).length} topic(s) →</div></button>`).join('')}</div>`}
function filterCourses(q){q=q.toLowerCase();document.querySelectorAll('#courseGrid [data-s]').forEach(x=>x.classList.toggle('hidden',!x.dataset.s.toLowerCase().includes(q)))}
function openCourse(id){course=id;view='course';render();scrollTo(0,0)}
function coursePage(){let c=courseData(course),ts=topics(course);return `<button onclick="nav('courses')" class="text-brand-700 font-bold">← Courses</button><section class="mt-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6"><span class="text-sm font-bold text-brand-700">${c[0]}</span><h1 class="text-3xl font-black mt-2">${esc(c[1])}</h1><p class="text-slate-500 mt-2">${esc(c[2])}</p></section><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4 mt-6">${ts.length?ts.map(topicCard).join(''):`<div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 col-span-full">This course area is ready for additional verified topic content.</div>`}</div>`}
function openTopic(id){topic=id;view='topic';render();scrollTo(0,0)}
function topicPage(){let t=TOPICS.find(x=>x.id===topic);return `<button onclick="openCourse('${t.course}')" class="text-brand-700 font-bold">← ${esc(courseData(t.course)[1])}</button><article class="max-w-4xl mt-4"><span class="text-xs font-bold text-brand-700">${esc(t.tag)} • ${t.course}</span><h1 class="text-3xl md:text-4xl font-black mt-2">${esc(t.title)}</h1><p class="text-lg text-slate-500 mt-2">${esc(t.summary)}</p><div class="space-y-5 mt-7"><div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><h2 class="text-xl font-black">Definition</h2><p class="mt-3 leading-7">${esc(t.definition)}</p></div><div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><h2 class="text-xl font-black">Key points</h2><ul class="mt-3 space-y-3">${t.points.map(x=>`<li class="flex gap-3"><b class="text-brand-700">✓</b><span>${esc(x)}</span></li>`).join('')}</ul></div><div class="p-5 rounded-2xl bg-brand-50 dark:bg-brand-950/20 border border-brand-200 dark:border-brand-900"><h2 class="text-xl font-black">Hausa explanation</h2><p class="mt-3 leading-7">${esc(t.hausa)}</p></div><div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><h2 class="text-xl font-black">Clinical / practical context</h2><p class="mt-3 leading-7">${esc(t.clinical)}</p></div><div class="p-5 rounded-2xl bg-amber-50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900"><h2 class="text-xl font-black">Common exam trap</h2><p class="mt-3">${esc(t.trap)}</p></div></div><div class="flex flex-wrap gap-3 mt-6"><button onclick="S.completed['${t.id}']=true;save();render()" class="px-5 py-3 rounded-xl bg-brand-700 text-white font-bold">${S.completed[t.id]?'✓ Completed':'Mark completed'}</button><button onclick="S.bookmarks.includes('${t.id}')?S.bookmarks=S.bookmarks.filter(x=>x!=='${t.id}'):S.bookmarks.push('${t.id}');save();render()" class="px-5 py-3 rounded-xl border border-slate-300 dark:border-slate-700 font-bold">${S.bookmarks.includes(t.id)?'★ Bookmarked':'☆ Bookmark'}</button><button onclick="startQuiz('${t.course}')" class="px-5 py-3 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold">Practice</button></div></article>`}
function practice(){return `<h1 class="text-3xl font-black">Practice Library</h1><p class="text-slate-500 mt-1">These are practice questions, not claimed official past questions.</p><div class="mt-5 p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900/50"><b>Authenticity policy:</b> No question is labelled authentic unless independently verified.</div><div class="grid md:grid-cols-2 gap-4 mt-5">${QUESTIONS.map((q,i)=>`<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5"><small class="text-slate-500">Practice • ${q[1]}</small><p class="font-bold mt-3">${i+1}. ${esc(q[3])}</p><small class="text-slate-500 block mt-2">${esc(q[2])}</small></div>`).join('')}</div><button onclick="nav('cbt')" class="mt-6 px-5 py-3 rounded-xl bg-brand-700 text-white font-bold">Start CBT</button>`}
function cbt(){return `<section class="max-w-2xl mx-auto text-center"><div class="text-5xl">✓</div><h1 class="text-3xl font-black mt-3">CBT Practice</h1><p class="text-slate-500 mt-2">Timed practice, instant scoring and saved performance.</p><div class="mt-6 p-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl text-left"><label class="font-bold">Number of questions<select id="qn" class="block w-full mt-2 p-3 rounded-xl bg-slate-50 dark:bg-slate-800"><option>5</option><option selected>10</option></select></label><label class="font-bold block mt-4">Mode<select id="mode" class="block w-full mt-2 p-3 rounded-xl bg-slate-50 dark:bg-slate-800"><option value="timed">Timed</option><option value="practice">Practice</option></select></label><button onclick="startQuiz()" class="w-full mt-5 py-4 rounded-xl bg-brand-700 text-white font-black">Start CBT</button></div></section>`}
function startQuiz(cid=null){let pool=QUESTIONS.filter(q=>!cid||q[1]===cid);if(!pool.length)pool=QUESTIONS;let n=Math.min(Number(document.getElementById('qn')?.value||10),pool.length);pool=[...pool].sort(()=>Math.random()-.5).slice(0,n);quiz={qs:pool,i:0,a:{},start:Date.now(),timed:document.getElementById('mode')?.value!=='practice',seconds:n*60};view='quiz';render();}
function qpage(){let q=quiz.qs[quiz.i],ans=quiz.a[q[0]],left=Math.max(0,quiz.seconds-Math.floor((Date.now()-quiz.start)/1000));return `<div class="max-w-4xl mx-auto"><div class="flex justify-between mb-4"><span class="text-sm text-slate-500">Question ${quiz.i+1}/${quiz.qs.length}</span><b id="clock" class="text-brand-700">${quiz.timed?fmt(left):'Practice'}</b></div><div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 md:p-8"><small class="text-brand-700 font-bold">${q[1]} • ${esc(q[2])}</small><h1 class="text-xl md:text-2xl font-black mt-4 leading-8">${esc(q[3])}</h1><div class="grid gap-3 mt-6">${q[4].map((o,i)=>`<button onclick="quiz.a['${q[0]}']=${i};render()" class="text-left p-4 rounded-xl border ${ans===i?'border-brand-600 bg-brand-50 dark:bg-brand-900/30':'border-slate-200 dark:border-slate-700'}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</button>`).join('')}</div><div class="flex justify-between mt-7"><button ${quiz.i?'':'disabled'} onclick="quiz.i--;render()" class="px-4 py-3 rounded-xl border disabled:opacity-40">Previous</button>${quiz.i===quiz.qs.length-1?`<button onclick="finish()" class="px-5 py-3 rounded-xl bg-brand-700 text-white font-bold">Finish</button>`:`<button onclick="quiz.i++;render()" class="px-5 py-3 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold">Next</button>`}</div></div></div>`}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){clearInterval(timer);if(view!=='quiz'||!quiz?.timed)return;timer=setInterval(()=>{let l=quiz.seconds-Math.floor((Date.now()-quiz.start)/1000),e=document.getElementById('clock');if(e)e.textContent=fmt(Math.max(0,l));if(l<=0){clearInterval(timer);finish()}},500)}
function finish(){clearInterval(timer);let c=quiz.qs.filter(q=>quiz.a[q[0]]===q[5]).length;let r={date:new Date().toISOString(),c,n:quiz.qs.length,p:Math.round(c/quiz.qs.length*100),a:quiz.a};S.scores.push(r);save();quiz={result:r,qs:quiz.qs};view='result';render()}
function result(){let r=quiz.result;return `<section class="max-w-3xl mx-auto"><div class="text-center"><div class="text-6xl font-black text-brand-700">${r.p}%</div><h1 class="text-2xl font-black mt-2">CBT Result</h1><p class="text-slate-500">${r.c} correct out of ${r.n}</p></div><div class="space-y-3 mt-7">${quiz.qs.map(q=>{let ok=r.a[q[0]]===q[5];return `<div class="p-5 rounded-2xl border ${ok?'border-emerald-200 bg-emerald-50 dark:bg-emerald-950/20':'border-rose-200 bg-rose-50 dark:bg-rose-950/20'}"><b>${ok?'✓':'✗'} ${esc(q[3])}</b><p class="text-sm mt-2">Correct answer: <b>${esc(q[4][q[5]])}</b></p><p class="text-sm mt-2 text-slate-600 dark:text-slate-300">${esc(q[6])}</p></div>`}).join('')}</div><div class="flex gap-3 mt-6"><button onclick="nav('cbt')" class="px-5 py-3 rounded-xl bg-brand-700 text-white font-bold">Another CBT</button><button onclick="nav('performance')" class="px-5 py-3 rounded-xl border font-bold">Performance</button></div></section>`}
function performance(){let avg=S.scores.length?Math.round(S.scores.reduce((a,b)=>a+b.p,0)/S.scores.length):0;return `<h1 class="text-3xl font-black">Performance</h1><p class="text-slate-500 mt-1">Saved locally on this device.</p><div class="grid sm:grid-cols-3 gap-4 mt-6">${stat('CBT attempts',S.scores.length,'Saved attempts')}${stat('Average score',avg+'%','Across attempts')}${stat('Questions answered',S.scores.reduce((a,b)=>a+b.n,0),'Recorded questions')}</div><section class="mt-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5"><h2 class="text-xl font-black">Recent results</h2><div class="space-y-2 mt-4">${S.scores.slice(-10).reverse().map(x=>`<div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800 flex justify-between"><span>${new Date(x.date).toLocaleString()}</span><b>${x.p}%</b></div>`).join('')||'<p class="text-slate-500 mt-3">No CBT attempt yet.</p>'}</div></section>`}
function sources(){return `<section class="max-w-4xl"><h1 class="text-3xl font-black">Sources & Authenticity</h1><p class="text-slate-500 mt-2">Official references used for the platform’s regulatory context.</p><div class="grid gap-4 mt-6">${SOURCES.map(s=>`<a target="_blank" rel="noopener" href="${s[1]}" class="block p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"><b>${esc(s[0])}</b><p class="text-sm text-slate-500 mt-2">${esc(s[2])}</p><span class="text-xs text-brand-700 break-all">${esc(s[1])}</span></a>`).join('')}</div><div class="mt-6 p-5 rounded-2xl bg-amber-50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900"><b>Safety note:</b> Current clinical guidance and Standing Orders should be checked before practice. This learning platform is not a substitute for supervision or professional judgement.</div></section>`}
function render(){theme();let c=view==='home'?home():view==='courses'?courses():view==='course'?coursePage():view==='topic'?topicPage():view==='practice'?practice():view==='cbt'?cbt():view==='quiz'?qpage():view==='result'?result():view==='performance'?performance():sources();document.getElementById('app').innerHTML=header()+`<main class="max-w-7xl mx-auto px-4 py-6">${c}</main><footer class="border-t border-slate-200 dark:border-slate-800 mt-10 p-8 text-center text-sm text-slate-500">© ${new Date().getFullYear()} AHMAD CHEW ACADEMY • Educational learning aid</footer>`;if(view==='quiz')tick()}
render();
</script></body></html>
